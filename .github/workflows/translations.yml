# 翻訳（carreplotter-i18n の site/）が更新されたら、サブモジュールを最新にしてページを作り直し、コミットする（push すると Pages が公開し直す）。
# carreplotter-i18n の .github/workflows/site.yml が repository_dispatch（translations-updated）で呼ぶ。手で動かすこともできる。
name: translations
on:
  repository_dispatch:
    types: [translations-updated]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: translations
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Update the translations
        run: git submodule update --remote translations
      - name: Build
        run: python3 src/build.py
      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "翻訳を更新（carreplotter-i18n $(git -C translations rev-parse --short HEAD)）"
          # この push で Pages のビルド（pages-build-deployment）も動く
          git push
