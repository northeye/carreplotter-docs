# src/（アダプターの一覧・マニュアルの構成・生成スクリプト）が main に入ったら、ページを作り直してコミットする
# （push すると Cloudflare Pages が公開し直す）。翻訳はサブモジュールが指している版のまま（更新は translations.yml）。
# main はほかの push で進んでいることがあるので、最新の main から作り直し、push が断られたらやり直す。
name: build
on:
  push:
    branches: [main]
    paths: ["src/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # main はルールセットで守っていて、迂回できるのはオーナーとこのアプリだけ。push はアプリのトークンで行う
      # （Contents の読み書きだけを持つ自前の GitHub App。Client ID は変数、秘密鍵はシークレットに入れてある）
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Build, commit and push
        # コミットの作者もアプリ（<slug>[bot]。メールの番号は bot のユーザー ID）にする
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot="$APP_SLUG[bot]"
          git config user.name "$bot"
          git config user.email "$(gh api "/users/$bot" --jq .id)+$bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git submodule update --init
            python3 src/build.py
            git add -A
            if git diff --cached --quiet; then
              echo "No changes"
              exit 0
            fi
            git commit -m "ページを作り直す（$(git rev-parse --short origin/main) までの src/ の変更）"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main が進んでいたので、最新の main から作り直す（$attempt 回目）"
            sleep 5
          done
          exit 1
